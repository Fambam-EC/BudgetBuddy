<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JSON Validator & Formatter</title>
  <style>
    :root {
      --bg-color: #0f172a;
      --card-bg: #1e293b;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --accent: #3b82f6;
      --accent-hover: #2563eb;
      --success: #10b981;
      --error: #ef4444;
      --border: #334155;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-main);
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      padding: 2rem 1rem;
    }

    .container {
      width: 100%;
      max-width: 800px;
      background-color: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 0.75rem;
      padding: 1.5rem;
      box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1), 0 2px 4px -2px rgb(0 0 0 / 0.1);
    }

    h1 {
      font-size: 1.5rem;
      margin-bottom: 0.5rem;
      text-align: center;
    }

    p.subtitle {
      color: var(--text-muted);
      font-size: 0.875rem;
      text-align: center;
      margin-bottom: 1.5rem;
    }

    .toolbar {
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem;
      margin-bottom: 1rem;
    }

    button {
      background-color: var(--accent);
      color: #fff;
      border: none;
      border-radius: 0.375rem;
      padding: 0.5rem 1rem;
      font-weight: 500;
      cursor: pointer;
      transition: background-color 0.15s ease;
    }

    button:hover {
      background-color: var(--accent-hover);
    }

    button.secondary {
      background-color: transparent;
      border: 1px solid var(--border);
      color: var(--text-main);
    }

    button.secondary:hover {
      background-color: var(--border);
    }

    textarea {
      width: 100%;
      height: 250px;
      background-color: #0b0f19;
      color: var(--text-main);
      border: 1px solid var(--border);
      border-radius: 0.375rem;
      padding: 0.75rem;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-size: 0.875rem;
      resize: vertical;
      margin-bottom: 1rem;
    }

    textarea:focus {
      outline: 2px solid var(--accent);
      border-color: transparent;
    }

    #status {
      padding: 0.75rem 1rem;
      border-radius: 0.375rem;
      font-size: 0.875rem;
      font-weight: 500;
      display: none;
      word-break: break-word;
    }

    #status.valid {
      display: block;
      background-color: rgba(16, 185, 129, 0.15);
      border: 1px solid var(--success);
      color: var(--success);
    }

    #status.invalid {
      display: block;
      background-color: rgba(239, 68, 68, 0.15);
      border: 1px solid var(--error);
      color: var(--error);
    }
  </style>
</head>
<body>

  <div class="container">
    <h1>JSON Validator & Formatter</h1>
    <p class="subtitle">Paste your JSON data below to validate and beautify it.</p>

    <div class="toolbar">
      <button onclick="validateAndFormatJSON()">Validate & Format</button>
      <button class="secondary" onclick="minifyJSON()">Minify</button>
      <button class="secondary" onclick="clearEditor()">Clear</button>
    </div>

    <textarea id="jsonInput" placeholder='{ "name": "John Doe", "age": 30 }'></textarea>

    <div id="status"></div>
  </div>

  <script>
    const jsonInput = document.getElementById('jsonInput');
    const statusBox = document.getElementById('status');

    function validateAndFormatJSON() {
      const rawText = jsonInput.value.trim();
      if (!rawText) {
        showStatus('Please enter some JSON to validate.', false);
        return;
      }

      try {
        const parsedObj = JSON.parse(rawText);
        const formatted = JSON.stringify(parsedObj, null, 2);
        jsonInput.value = formatted;
        showStatus('Valid JSON ✅', true);
      } catch (err) {
        showStatus(`Invalid JSON ❌ — ${err.message}`, false);
      }
    }

    function minifyJSON() {
      const rawText = jsonInput.value.trim();
      if (!rawText) return;

      try {
        const parsedObj = JSON.parse(rawText);
        jsonInput.value = JSON.stringify(parsedObj);
        showStatus('Valid JSON (Minified) ✅', true);
      } catch (err) {
        showStatus(`Cannot minify. Invalid JSON ❌ — ${err.message}`, false);
      }
    }

    function clearEditor() {
      jsonInput.value = '';
      statusBox.style.display = 'none';
      statusBox.className = '';
      statusBox.textContent = '';
    }

    function showStatus(message, isValid) {
      statusBox.textContent = message;
      statusBox.className = isValid ? 'valid' : 'invalid';
      statusBox.style.display = 'block';
    }
  </script>

</body>
</html>

<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f4f7f2">
  <title>Reset your BudgetBuddy password</title>
  <style>
    :root {
      color-scheme: light;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: #18332a;
      background: #f4f7f2;
      font-synthesis: none;
      text-rendering: optimizeLegibility;
    }
    * { box-sizing: border-box; }
    body { margin: 0; padding: 48px 20px; }
    main {
      width: min(100%, 520px);
      margin: 0 auto;
      padding: 36px;
      border: 1px solid #dbe5db;
      border-radius: 18px;
      background: #fff;
      box-shadow: 0 12px 36px rgb(24 51 42 / 8%);
    }
    h1 { margin: 0 0 12px; font-size: clamp(1.75rem, 6vw, 2.25rem); }
    p { color: #45574e; line-height: 1.6; }
    label { display: block; margin: 18px 0 6px; font-weight: 650; }
    input {
      width: 100%;
      min-height: 46px;
      padding: 10px 12px;
      border: 1px solid #aab9ae;
      border-radius: 8px;
      font: inherit;
    }
    input:focus-visible, button:focus-visible, a:focus-visible {
      outline: 3px solid #65a982;
      outline-offset: 3px;
    }
    button {
      width: 100%;
      min-height: 48px;
      margin-top: 20px;
      padding: 12px 16px;
      border: 0;
      border-radius: 8px;
      background: #1d6249;
      color: white;
      font: inherit;
      font-weight: 700;
      cursor: pointer;
    }
    button:disabled { cursor: wait; opacity: .7; }
    a { color: #1d6249; }
    .notice { min-height: 1.5em; margin-top: 16px; }
    .notice.error { color: #a42e2e; }
    .notice.success { color: #1d6249; }
    @media (max-width: 480px) {
      body { padding: 20px 12px; }
      main { padding: 24px 20px; }
    }
  </style>
</head>
<body>
  <main>
    <h1>Reset your BudgetBuddy password</h1>
    <p>Enter the email address associated with your account. If an account exists for that email, we’ll send a password reset link.</p>
    <form id="reset-form">
      <label for="email">Account email</label>
      <input id="email" name="email" type="email" autocomplete="email" required>
      <button id="submit-button" type="submit">Send reset link</button>
    </form>
    <p id="status" class="notice" role="status" aria-live="polite"></p>
    <p><a href="/delete-account">Back to account deletion</a> · <a href="/support">BudgetBuddy Support</a></p>
  </main>
  <script>
    const form = document.getElementById('reset-form');
    const submitButton = document.getElementById('submit-button');
    const status = document.getElementById('status');

    form.addEventListener('submit', async (event) => {
      event.preventDefault();
      submitButton.disabled = true;
      status.className = 'notice';
      status.textContent = 'Sending your request…';
      try {
        const response = await fetch('/forgot-password', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email: form.elements.email.value.trim() }),
        });
        const result = await response.json();
        if (!response.ok) {
          throw new Error(result.error || 'Unable to send a reset link. Please try again.');
        }
        status.className = 'notice success';
        status.textContent = result.message;
        form.reset();
      } catch (error) {
        status.className = 'notice error';
        status.textContent = error instanceof Error
          ? error.message
          : 'Unable to send a reset link. Please try again.';
      } finally {
        submitButton.disabled = false;
      }
    });
  </script>
</body>
</html>

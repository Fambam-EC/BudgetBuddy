<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mini Postman Client</title>
    <!-- Tailwind CSS Play CDN -->
    <script src="https://jsdelivr.net"></script>
    <style>
        .tab-content { display: none; }
        .tab-content.active { display: block; }
    </style>
</head>
<body class="bg-gray-900 text-gray-100 min-h-screen font-sans p-6">

    <div class="max-w-6xl mx-auto bg-gray-800 rounded-lg shadow-xl overflow-hidden border border-gray-700">
        <!-- Header -->
        <header class="bg-gray-800 px-6 py-4 border-b border-gray-700 flex justify-between items-center">
            <h1 class="text-xl font-bold text-indigo-400 flex items-center gap-2">
                🚀 Mini Postman Client
            </h1>
            <span class="text-xs text-gray-400 bg-gray-700 px-2 py-1 rounded">V1.0 (Browser Native)</span>
        </header>

        <!-- Request Address Bar -->
        <div class="p-6 border-b border-gray-700 bg-gray-800/50">
            <div class="flex flex-col md:flex-row gap-3">
                <select id="requestMethod" class="bg-gray-700 border border-gray-600 text-white text-sm rounded-lg focus:ring-indigo-500 focus:border-indigo-500 p-3 font-semibold w-full md:w-32">
                    <option value="GET" selected>GET</option>
                    <option value="POST">POST</option>
                    <option value="PUT">PUT</option>
                    <option value="PATCH">PATCH</option>
                    <option value="DELETE">DELETE</option>
                </select>
                
                <input type="url" id="requestUrl" value="https://typicode.com" placeholder="https://example.com" 
                    class="flex-1 bg-gray-700 border border-gray-600 text-white text-sm rounded-lg focus:ring-indigo-500 focus:border-indigo-500 p-3 outline-none" required>
                
                <button id="sendBtn" onclick="sendRequest()" class="bg-indigo-600 hover:bg-indigo-700 text-white font-bold px-6 py-3 rounded-lg transition dynamic flex items-center justify-center gap-2">
                    <span>Send</span>
                </button>
            </div>
        </div>

        <!-- Request Body / Headers Setup Tabs -->
        <div class="p-6 border-b border-gray-700">
            <div class="flex border-b border-gray-700 mb-4">
                <button onclick="switchTab('headersTab', 'headersContent')" id="headersTab" class="px-4 py-2 text-sm font-medium text-indigo-400 border-b-2 border-indigo-500 focus:outline-none tab-btn">Headers</button>
                <button onclick="switchTab('bodyTab', 'bodyContent')" id="bodyTab" class="px-4 py-2 text-sm font-medium text-gray-400 hover:text-gray-200 focus:outline-none tab-btn">Body (JSON)</button>
            </div>

            <!-- Headers Tab Content -->
            <div id="headersContent" class="tab-content active">
                <p class="text-xs text-gray-400 mb-2">Enter custom headers in JSON format:</p>
                <textarea id="requestHeaders" rows="3" class="w-full bg-gray-700 border border-gray-600 text-white font-mono text-sm rounded-lg p-3 focus:ring-indigo-500 focus:border-indigo-500 outline-none" placeholder='{ "Content-Type": "application/json" }'></textarea>
            </div>

            <!-- Body Tab Content -->
            <div id="bodyContent" class="tab-content">
                <p class="text-xs text-gray-400 mb-2">Enter raw payload (JSON format):</p>
                <textarea id="requestBody" rows="4" class="w-full bg-gray-700 border border-gray-600 text-white font-mono text-sm rounded-lg p-3 focus:ring-indigo-500 focus:border-indigo-500 outline-none" placeholder='{ "name": "John Doe", "job": "Developer" }'></textarea>
            </div>
        </div>

        <!-- Response Window Area -->
        <div class="p-6 bg-gray-900/40">
            <div class="flex justify-between items-center mb-3">
                <h3 class="text-lg font-semibold text-gray-300">Response Data</h3>
                <div class="flex gap-4 text-sm">
                    <span id="responseStatus" class="font-mono text-gray-400">Status: --</span>
                    <span id="responseTime" class="font-mono text-gray-400">Time: --</span>
                </div>
            </div>
            <pre id="responseOutput" class="w-full bg-gray-950 border border-gray-700 rounded-lg p-4 font-mono text-sm text-green-400 overflow-x-auto min-h-[150px] whitespace-pre-wrap">Your API responses will render here...</pre>
        </div>
    </div>

    <!-- Application Scripting Logic -->
    <script>
        // Tab switching utility logic
        function switchTab(tabId, contentId) {
            document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
            document.querySelectorAll('.tab-btn').forEach(el => {
                el.classList.remove('text-indigo-400', 'border-indigo-500');
                el.classList.add('text-gray-400');
            });
            
            document.getElementById(contentId).classList.add('active');
            const activeTab = document.getElementById(tabId);
            activeTab.classList.remove('text-gray-400');
            activeTab.classList.add('text-indigo-400', 'border-indigo-500');
        }

        // Main HTTP Client Request Engine
        async function sendRequest() {
            const method = document.getElementById('requestMethod').value;
            const url = document.getElementById('requestUrl').value;
            const headersInput = document.getElementById('requestHeaders').value.trim();
            const bodyInput = document.getElementById('requestBody').value.trim();
            
            const sendBtn = document.getElementById('sendBtn');
            const outputEl = document.getElementById('responseOutput');
            const statusEl = document.getElementById('responseStatus');
            const timeEl = document.getElementById('responseTime');

            if (!url) {
                alert('Please enter a valid request destination target URL.');
                return;
            }

            // Visual UI Loading updates
            sendBtn.disabled = true;
            sendBtn.classList.add('opacity-50');
            outputEl.textContent = 'Sending request, awaiting data...';
            statusEl.textContent = 'Status: Fetching...';
            timeEl.textContent = 'Time: Running...';

            let customHeaders = {};
            if (headersInput) {
                try {
                    customHeaders = JSON.parse(headersInput);
                } catch(e) {
                    alert('Invalid JSON formatting in Headers input area.');
                    sendBtn.disabled = false;
                    sendBtn.classList.remove('opacity-50');
                    return;
                }
            }

            const fetchOptions = {
                method: method,
                headers: {
                    'Content-Type': 'application/json',
                    ...customHeaders
                }
            };

            // Process payload structures for body-supported requests
            if (['POST', 'PUT', 'PATCH', 'DELETE'].includes(method) && bodyInput) {
                try {
                    JSON.parse(bodyInput); // Validate format validation
                    fetchOptions.body = bodyInput;
                } catch(e) {
                    alert('Invalid JSON formatting syntax inside Request Body tab.');
                    sendBtn.disabled = false;
                    sendBtn.classList.remove('opacity-50');
                    return;
                }
            }

            const startTime = performance.now();

            try {
                const response = await fetch(url, fetchOptions);
                const endTime = performance.now();
                const executionTime = Math.round(endTime - startTime);
                
                timeEl.textContent = `Time: ${executionTime}ms`;
                statusEl.textContent = `Status: ${response.status} ${response.statusText}`;

                // Colorize status elements based on feedback results
                if (response.ok) {
                    statusEl.className = "font-mono text-green-400";
                } else {
                    statusEl.className = "font-mono text-red-400";
                }

                const data = await response.json();
                outputEl.textContent = JSON.stringify(data, null, 4);
                outputEl.className = "w-full bg-gray-950 border border-gray-700 rounded-lg p-4 font-mono text-sm text-green-400 overflow-x-auto min-h-[150px] whitespace-pre-wrap";
            } catch (error) {
                const endTime = performance.now();
                timeEl.textContent = `Time: ${Math.round(endTime - startTime)}ms`;
                statusEl.textContent = 'Status: Error';
                statusEl.className = "font-mono text-red-500";
                
                outputEl.textContent = `Fetch Failed Request Error:\n${error.message}\n\nNote: If testing local/external links directly from standard browser pages, ensure remote endpoints allow cross-origin resource access (CORS settings configuration).`;
                outputEl.className = "w-full bg-gray-950 border border-red-900 rounded-lg p-4 font-mono text-sm text-red-400 overflow-x-auto min-h-[150px] whitespace-pre-wrap";
            } finally {
                sendBtn.disabled = false;
                sendBtn.classList.remove('opacity-50');
            }
        }
    </script>
</body>
</html>
